name: Build patched Alloy image

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sanchescom/alloy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1.14.0-patched
          build-args: |
            RELEASE_BUILD=1
            VERSION=v1.14.0-patched
          cache-from: type=gha
          cache-to: type=gha,mode=max
